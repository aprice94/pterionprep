- id: progav-2
  name: "proGAV 2.0"
  full_name: "Miethke proGAV 2.0 (B. Braun / Aesculap)"
  maker: "Miethke"
  kind: programmable
  status: "Current"
  posture: gravity
  convertible: true
  summary: "Adjustable differential-pressure unit (0–20 cmH2O) with an optional integrated SHUNTASSISTANT 2.0 gravitational unit (10–35 cmH2O). Lying = DP setting; upright = DP + gravitational unit."
  mechanism: "Titanium; ball-cone DP unit with bow spring on a braked rotor + tantalum-ball gravitational unit."
  measured: "Opening pressures in cmH2O; gravitational-unit values referenced to 5 mL/h (~1–2 cmH2O higher at 20 mL/h)."
  tolerance: "Not stated in the IFU excerpt"
  gen:
    dp: {min: 0, max: 20, step: 1, adjustable: true, label: "Adjustable DP unit"}
    grav: {options: [0, 10, 15, 20, 25, 30, 35], adjustable: false, label: "Gravitational unit (fixed at implant; 0 = none)"}
  range_text: "DP 0–20 cmH2O in 1-cmH2O steps (factory preset 5) · gravitational unit none / 10 / 15 / 20 / 25 / 30 / 35 cmH2O"
  mri: {level: ok, label: "MR Conditional ≤3 T — no setting change", after: "Miethke: verification after MRI is not required."}
  xray:
    img: "progav-2-vach2025.jpg"
    more: "progav-2-rhomberg2024.jpg"
    credit: vach
    more_credit: rhomberg
    features:
      - "Round titanium valve; four rotor magnets show as white dots in opposite pairs."
      - "Two black burr holes mark the rotor's rear; the gap between the two front magnets (triangle apex) points to the setting."
      - "A side recess marks orientation so the scale is not read mirror-image; the gravitational unit carries a coded pressure marking."
  adjust: "proGAV 2.0 Compass (locate/read), Adjustment Tool, Checkmate, or M.blue plus instruments. Light pressure releases the rotor brake (click)."
  pearls:
    - "Change by ≤8 cmH2O per adjustment step — the rotor takes the short way (3 → 18 must go 3 → 11 → 18)."
    - "Implant the gravitational unit parallel to the body axis (retroauricular is fine; height doesn't matter)."
    - "Vibration (e.g., jogging) can transiently lower opening pressure by 25–35% (lab data)."
