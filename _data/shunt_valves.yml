      settings: [{s: "1", p: 50}, {s: "2", p: 100}, {s: "3", p: 150}, {s: "4", p: 220}, {s: "5", p: 300}]
    - id: spv-400
      label: "SPV-400 / SPVA-400 (80–400) — 3 dots"
      settings: [{s: "1", p: 80}, {s: "2", p: 150}, {s: "3", p: 230}, {s: "4", p: 330}, {s: "5", p: 400}]
    - id: spv-sx
      label: "SPV-SX — standard + pre-attached SiphonX (+200 upright)"
      posture: gravity
      settings: [{s: "1", p: 30, up: 230}, {s: "2", p: 70, up: 270}, {s: "3", p: 110, up: 310}, {s: "4", p: 150, up: 350}, {s: "5", p: 200, up: 400}]
    - id: spv-140-sx
      label: "SPV-140-SX — 10–140 + pre-attached SiphonX (+200 upright)"
      posture: gravity
      settings: [{s: "1", p: 10, up: 210}, {s: "2", p: 40, up: 240}, {s: "3", p: 80, up: 280}, {s: "4", p: 110, up: 310}, {s: "5", p: 140, up: 340}]
  mri: {level: check, label: "MRI-stable (magnetic lock); MR Conditional 1.5/3 T", after: "Sophysa still recommends checking the setting before and after MRI; valve rotation during a 3 T exposure can change it."}
