    features:
      - "Two square magnets in a round, mostly radiolucent body; arrow-shaped connectors show flow direction."
      - "Titanium studs on the right side mark the 5 rotor positions; radiopaque range dots left of the inlet: 0 = 10–140, 1 = 30–200, 2 = 50–300, 3 = 80–400."
  adjust: "Polaris Adjustment Kit (locator, compass, magnet) or Electronic Compass; clockwise raises, counter-clockwise lowers. The locator range must match the valve range."
