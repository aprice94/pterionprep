# Shunt valve reference data — single source for /shunts/valves/ (library) and /shunts/converter/.
# All pressures in mmH2O unless a `gen` block says otherwise (gen blocks use cmH2O, as the manufacturer does).
# Every value below is transcribed from the manufacturer document or FDA record listed in `sources`.
#
# kind:     programmable | fixed | addon | flow
# posture:  none    — opening pressure does not change with posture
#           delta   — Medtronic Delta-chamber siphon control (manufacturer tests at 0 and −50 cmH2O hydrostatic)
#           gravity — gravitational unit: lying = differential-pressure unit only; upright = DP + gravitational unit
#           switch  — Miethke DualSwitch: separate low-pressure (lying) and high-pressure (upright) chambers
# settings: s = label, p = nominal lying pressure, lo/hi = range, up = nominal upright pressure, up_lo/up_hi = upright range,
#           tol = ± tolerance, sys = manufacturer-measured system pressure with a catheter attached, note = free text
# gen:      dims for continuously adjustable / per-implant Miethke valves (cmH2O):
#           lying = dp ; upright = dp + grav

- id: certas-plus
  name: "CERTAS Plus"
  full_name: "Codman CERTAS Plus Programmable Valve"
  maker: "Integra (Codman)"
  kind: programmable
  status: "Current"
  posture: none
  convertible: true
  summary: "8-setting programmable ball-in-cone valve; setting 8 is a flow-limiting 'virtual off' (≥400 mmH2O). Optional integrated SiphonGuard."
  mechanism: "Ball-in-cone differential-pressure valve; magnetically adjustable rotating construct."
  measured: "Average pressure across 5–50 mL/h (Integra performance chart), same in any gravitational orientation."
  tolerance: "±20 mmH2O (settings 1–3) · ±25 (setting 4) · ±35 (settings 5–7)"
  settings:
    - {s: "1", p: 25, tol: 20}
    - {s: "2", p: 50, tol: 20}
    - {s: "3", p: 80, tol: 20}
    - {s: "4", p: 110, tol: 25}
    - {s: "5", p: 145, tol: 35}
    - {s: "6", p: 180, tol: 35}
    - {s: "7", p: 215, tol: 35}
    - {s: "8", p: 400, min: true, note: "Virtual off — flow-limiting, minimum 400 mmH2O"}
  mri: {level: check, label: "Resists unintended change at 3 T", after: "Confirm the setting after MRI (Integra)."}
  xray:
    img: "certas-plus-vach2025.jpg"
    more: "certas-plus-rhomberg2024.jpg"
    credit: vach
    more_credit: rhomberg
    features:
      - "Elongated valve; bright rectangular magnets on a central rotating construct."
      - "Setting = the overlay sector holding the magnet that has the tantalum ball beside it; a right-hand-side (RHS) marker orients the film."
      - "Read with the Integra X-ray overlay tool aligned to the valve centerline and connectors."
  adjust: "CERTAS Tool Kit (mechanical) or CERTAS Plus Electronic Tool Kit (not for the MR suite). Audible click per step; safety stop between settings 1 and 8. Keep tissue over the valve <10 mm."
  pearls:
    - "Made available after March 2015 (Integra)."
    - "Setting 8 is not 'closed' — it limits flow with a ≥400 mmH2O minimum."
  sources:
    - {t: "Integra — CERTAS Plus Electronic Tool Kit Quick Reference Guide (1195787-2-EN, ©2024)", u: "https://app.sales.integralife.com/csf-management/programmable-valves/certas/certas-plus-electronic-tool-kit-quick-reference-guide.pdf"}

- id: hakim-programmable
  name: "Hakim Programmable (CHPV)"
  full_name: "Codman HAKIM Programmable Valve"
  maker: "Integra (Codman)"
  kind: programmable
  status: "Current"
  posture: none
  convertible: true
  summary: "18 settings from 30 to 200 mmH2O in 10 mmH2O steps; programmed with a codified magnetic signal that drives an internal stepper motor. Available with SiphonGuard."
  mechanism: "Synthetic-ruby ball-in-cone; flat stainless spring on a stepper-motor cam (titanium chassis)."
  measured: "Nominal setting = valve opening pressure. Integra's L-P IFU also reports the measured system pressure with a 120 cm peritoneal catheter at 20 mL/h (shown as 'with catheter')."
  tolerance: "±14 mmH2O (settings 30–120) · ±19 (130–200), regardless of orientation; ~10 mmH2O per step"
  settings:
    - {s: "30", p: 30, sys: 61, tol: 14}
    - {s: "40", p: 40, sys: 68, tol: 14}
    - {s: "50", p: 50, sys: 79, tol: 14}
    - {s: "60", p: 60, sys: 86, tol: 14}
    - {s: "70", p: 70, sys: 97, tol: 14}
    - {s: "80", p: 80, sys: 106, tol: 14}
    - {s: "90", p: 90, sys: 116, tol: 14}
    - {s: "100", p: 100, sys: 124, tol: 14}
    - {s: "110", p: 110, sys: 135, tol: 14}
    - {s: "120", p: 120, sys: 144, tol: 14}
    - {s: "130", p: 130, sys: 153, tol: 19}
    - {s: "140", p: 140, sys: 162, tol: 19}
    - {s: "150", p: 150, sys: 174, tol: 19}
    - {s: "160", p: 160, sys: 184, tol: 19}
    - {s: "170", p: 170, sys: 197, tol: 19}
    - {s: "180", p: 180, sys: 208, tol: 19}
    - {s: "190", p: 190, sys: 221, tol: 19}
    - {s: "200", p: 200, sys: 229, tol: 19}
  mri: {level: high, label: "Up to 3 T will not damage it but MAY CHANGE THE SETTING", after: "Always confirm the setting after MRI (X-ray or programmer). Repeated 3 T exposure may demagnetize the rotor and reduce programmability."}
  xray:
    img: "hakim-programmable-vach2025.jpg"
    more: "hakim-programmable-rhomberg2024.jpg"
    credit: vach
    more_credit: rhomberg
    features:
      - "Small ring (cam) with an adjacent white dot — the radiopaque marker on the cam."
      - "Read the marker position against the fixed right-hand-side marker; settings 70, 120 and 170 sit on the central cross."
      - "Inverted valve: the white marker appears on the LEFT. Program 210 − desired (190/200 not reachable) after first setting 200."
  adjust: "Codman HAKIM programmer (82-3190R) or VPV System. Keep ≤1 cm tissue over the mechanism (programmer reaches ~2 cm). Programmer is MR Unsafe."
  pearls:
    - "While becoming familiar, change by no more than ±40 mmH2O per 24 h and monitor for 24 h (Integra IFU)."
    - "Magnets >80 gauss (speakers, household magnets) near the valve can change the setting."
    - "X-ray the whole system after implantation, after every reprogramming, and after every MRI."
  sources:
    - {t: "Integra — HAKIM Programmable Valve L-P IFU (LCN-207384-001 Rev E, 11/2020)", u: "https://app.sales.integralife.com/csf-management/programmable-valves/chpv/ifus/hakim-programmable-valve-lumbo-peritoneal-l-p-ifu-rev-e-ins.pdf"}
    - {t: "Integra — Codman Hakim Programmable Valve procedure guide (1750620-1-EN, 12/2020)", u: "https://app.sales.integralife.com/csf-management/programmable-valves/chpv/hakim-programmable-valve-procedure-guide-en.pdf"}

- id: strata-ii
  name: "Strata II (with Delta chamber)"
  full_name: "Medtronic PS Medical Strata / Strata II Adjustable Pressure Valve"
  maker: "Medtronic (PS Medical)"
  kind: programmable
  status: "Legacy (widely implanted)"
  posture: delta
  convertible: true
  summary: "5 performance levels (0.5–2.5). Adjustable ball-in-cone mechanism in series with the Delta chamber siphon-control device."
  mechanism: "Magnetically adjustable valve mechanism + normally closed Delta chamber (opens to positive ventricular pressure, stays closed to negative distal pressure)."
  measured: "Median pressure at 5 → 50 mL/h. Lying = 0 cmH2O hydrostatic; upright = −50 cmH2O hydrostatic (Medtronic charts). Nominal = midpoint of the range."
  tolerance: "Not stated on the Strata II chart (Strata NSC: ±15–25 mmH2O)"
  settings:
    - {s: "PL 0.5", p: 20, lo: 15, hi: 25, up: 40, up_lo: 30, up_hi: 50}
    - {s: "PL 1.0", p: 45, lo: 35, hi: 55, up: 60, up_lo: 50, up_hi: 70}
    - {s: "PL 1.5", p: 80, lo: 70, hi: 90, up: 95, up_lo: 85, up_hi: 105}
    - {s: "PL 2.0", p: 115, lo: 105, hi: 125, up: 130, up_lo: 120, up_hi: 140}
    - {s: "PL 2.5", p: 145, lo: 135, hi: 155, up: 157, up_lo: 147, up_hi: 167}
  mri: {level: high, label: "3 T will not damage the valve but may change the setting", after: "Check the performance level immediately after MRI (Medtronic)."}
  xray:
    img: "medtronic-strata-rhomberg2024.jpg"
    credit: rhomberg
    features:
      - "Bright, slightly irregular dense magnet inside a faint (mostly non-metallic) valve body."
      - "Performance level can be confirmed by X-ray, though Medtronic designed the hand tools to verify without one."
  adjust: "Strata hand tools (locator, indicator, adjustment — 45805) or StrataVarius electronic system (45806, numeric mmH2O readout)."
  pearls:
    - "StrataVarius shows a numeric value per level (e.g., PL 2.0 = 115 mmH2O, the chart midpoint)."
  recalls:
    - "FDA Class 2 recall Z-1121-2017 (Strata II & Strata NSC, all catalog numbers; 1/17/2017–6/2/2017): reports of discrepancies between the set performance level and the X-ray reading; IFU warning updated."
  sources:
    - {t: "Medtronic — Strata Family of Adjustable Valves brochure (LIT59585 Rev A, 11/2010)", u: "https://www.tjn-eng.com/images/prodocts/LIT59585_Strata_Brochure_RevA_LR.pdf"}
    - {t: "Medtronic — CSF Management product catalog (UC201709479bEN, ©2020)", u: "https://storage.mtender.gov.md/get/62e32610-8126-48d5-b9e5-1492eacedf07-1756970341681"}
    - {t: "FDA recall Z-1121-2017", u: "https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfRes/res.cfm?id=152582"}

