  measured: "Median pressure at 5 → 50 mL/h; nominal = midpoint."
  tolerance: "PL 0.5: ±15 mmH2O (5 mL/h), ±25 (50 mL/h); PL 1.0–2.5: ±25 mmH2O"
  settings:
    - {s: "PL 0.5", p: 25, lo: 15, hi: 35}
    - {s: "PL 1.0", p: 45, lo: 35, hi: 55}
    - {s: "PL 1.5", p: 100, lo: 90, hi: 110}
    - {s: "PL 2.0", p: 155, lo: 145, hi: 165}
    - {s: "PL 2.5", p: 210, lo: 200, hi: 220}
